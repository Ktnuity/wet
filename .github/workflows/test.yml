name: Test Wet

on:
  push:
    branches:
      - '*'
    paths:
      - '**'
      - '.github/workflows/**'

jobs:
  test-linux:
    name: Test Linux
    runs-on: ktnuity-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.3'

      - name: Validate Go
        run: go version

      - name: Build - Pre-requisites
        run: |
          if [[ ! -d "./bin" ]]; then
            mkdir ./bin
          fi

      - name: Build - Generate
        run: go generate ./...
      - name: Build - Tidy
        run: go mod tidy
      - name: Build - Vet
        run: go vet ./...
      - name: Build CLI
        run: go build -o bin/wet cmd/cli/main.go
      - name: Build Test
        run: go build -o bin/test cmd/test/main.go

      - name: Test Wet
        run: |
          chmod +x ./bin/test
          ./bin/test

  test-windows:
    name: Test Windows
    runs-on: windows-latest
    steps:
      - name: Setup Git
        run: git config --global core.autocrlf false

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.3'

      - name: Validate Go
        run: go version

      - name: Build - Pre-requisites
        shell: cmd
        run: |
          if not exist bin mkdir bin

      - name: Build - Generate
        shell: cmd
        run: go generate ./...
      - name: Build - Tidy
        shell: cmd
        run: go mod tidy
      - name: Build - Vet
        shell: cmd
        run: go vet ./...
      - name: Build CLI
        shell: cmd
        run: go build -o bin\wet.exe cmd/cli/main.go
      - name: Build Test
        shell: cmd
        run: go build -o bin\test.exe cmd/test/main.go

      - name: Test Wet
        shell: cmd
        run: |
          bin\test.exe

  test-macos:
    name: Test macOS
    runs-on: ktnuity-macos
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.3'

      - name: Validate Go
        run: go version

      - name: Build - Pre-requisites
        run: |
          if [[ ! -d "./bin" ]]; then
            mkdir ./bin
          fi

      - name: Build - Generate
        run: go generate ./...
      - name: Build - Tidy
        run: go mod tidy
      - name: Build - Vet
        run: go vet ./...
      - name: Build CLI
        run: go build -o bin/wet cmd/cli/main.go
      - name: Build Test
        run: go build -o bin/test cmd/test/main.go

      - name: Test Wet
        run: |
          chmod +x ./bin/test
          ./bin/test
